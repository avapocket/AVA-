<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title> AVA ОБУЧЕНИЕ </title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #0f1117;
      color: white;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .app {
      width: 100%;
      max-width: 430px;
      min-height: 100vh;
      padding: 35px 22px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .top {
      text-align: center;
      padding-top: 40px;
    }

    .logo {
      font-size: 52px;
      margin-bottom: 25px;
    }

    h1 {
      font-size: 32px;
      margin-bottom: 14px;
    }

    .subtitle {
      color: #a8adb8;
      font-size: 17px;
      line-height: 1.5;
    }

    .card {
      background: #191c25;
      border-radius: 24px;
      padding: 25px;
      margin-top: 35px;
      text-align: center;
    }

    .card-title {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .card-text {
      color: #a8adb8;
      line-height: 1.5;
    }

    .button {
      width: 100%;
      border: none;
      border-radius: 18px;
      padding: 18px;
      background: #ffffff;
      color: #111111;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .button:active {
      transform: scale(0.98);
    }

    .bottom {
      color: #777d89;
      text-align: center;
      font-size: 13px;
      margin-top: 20px;
    }
  </style>
</head>

<body>

  <div class="app">

    <div class="top">

      <div class="logo">📈</div>

      <h1>Trading Academy</h1>

      <p class="subtitle">
        Научись понимать рынок<br>
        простыми словами.
      </p>

      <div class="card">

        <div class="card-title">
          Начнём с самого начала
        </div>

        <p class="card-text">
          Свечи, графики, движение цены,
          анализ и многое другое.
        </p>

      </div>

    </div>

    <div>
      <button class="button" onclick="startCourse()">
        Начать обучение →
      </button>

      <div class="bottom">
        Обучение с нуля
      </div>
    </div>

  </div>

  <script>
    function startCourse() {
      alert("Скоро начнём обучение 🚀");
    }
  </script>

</body>
</html>
